    <script type="module">
// 怡雅苑 First-Person Walkthrough Prototype
// 5 座新十字型（35 層 / 2 長 2 短翼 / 白＋青綠清爽幾何）＋中央花園＋停車場＋籃球場＋遊樂場＋入口
// 控制：PointerLock（滑鼠轉視角）＋WASD 行＋Shift 跑＋圓碰撞
import * as THREE_NS from 'three';
import { PointerLockControls } from 'three/examples/jsm/controls/PointerLockControls.js';
import { mergeGeometries } from 'three/examples/jsm/utils/BufferGeometryUtils.js';

// ============================================================================
// 畫風：卡通賽璐珞（Cel-shaded）——參考圖：沙色大地＋青綠天空＋粗黑描邊＋硬邊陰影
//   · 所有材質 → MeshToonMaterial（3 檔硬階梯光）
//   · 全屏後處理：以深度圖找輪廓／折角 → 畫黑色描邊（唔使加倍幾何）
//   · 色調：暖亮部＋冷暗部
// ============================================================================
const THREE = { ...THREE_NS };   // 可改寫嘅副本（ES module namespace 唔可以直接改）
const TOON_GRAD = (() => {
  const t = new THREE_NS.DataTexture(Uint8Array.from([0, 150, 255]), 3, 1, THREE_NS.RedFormat);
  t.minFilter = t.magFilter = THREE_NS.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();
// 舊代碼用 MeshStandardMaterial → 一律映射成卡通材質（只保留 color／map／透明／自發光）
THREE.MeshStandardMaterial = function ToonCompat(p = {}) {
  const q = { color: p.color !== undefined ? p.color : 0xffffff, gradientMap: TOON_GRAD };
  for (const k of ['map', 'transparent', 'opacity', 'side', 'emissive', 'emissiveIntensity', 'vertexColors', 'depthWrite', 'polygonOffset', 'polygonOffsetFactor', 'polygonOffsetUnits'])
    if (p[k] !== undefined) q[k] = p[k];
  return new THREE_NS.MeshToonMaterial(q);
};

const app = document.getElementById('app');
const hud = document.getElementById('hud');
const overlay = document.getElementById('overlay');
const scene = new THREE.Scene();

// 天空：青綠漸層（參考圖：薄荷青 → 暖米白地平線）
const skyTextures = (() => {
  function tex(stops) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 512;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 512);
    stops.forEach(([p, col]) => grd.addColorStop(p, col));
    g.fillStyle = grd; g.fillRect(0, 0, 64, 512);
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  return {
    day: tex([[0, '#79c2c4'], [0.34, '#92cfca'], [0.52, '#b4dcd0'], [0.7, '#d6e8d4'], [0.86, '#efe9d2'], [1, '#e9dfc3']]),
    dusk: tex([[0, '#58739a'], [0.3, '#9b8aa6'], [0.5, '#e0a893'], [0.7, '#f3c79b'], [0.86, '#f5dcb0'], [1, '#e8d2ae']]),
    night: tex([[0, '#0c1630'], [0.35, '#16254a'], [0.55, '#25386a'], [0.8, '#34497a'], [1, '#3a4d78']]),
  };
})();
scene.background = skyTextures.day;

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
camera.position.set(0, 1.6, 77);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.info.autoReset = false;
app.appendChild(renderer.domElement);

// ---------- 後處理：場景 → RT（MSAA＋深度貼圖）→ 描邊＋調色 → 螢幕 ----------
const _sz = new THREE.Vector2();
renderer.getDrawingBufferSize(_sz);
const sceneRT = new THREE.WebGLRenderTarget(_sz.x, _sz.y, {
  type: THREE.HalfFloatType, samples: 4, depthBuffer: true,
  depthTexture: new THREE.DepthTexture(_sz.x, _sz.y),
});
sceneRT.texture.colorSpace = THREE.LinearSRGBColorSpace;
const postMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    tColor: { value: sceneRT.texture }, tDepth: { value: sceneRT.depthTexture },
    texel: { value: new THREE.Vector2(1 / _sz.x, 1 / _sz.y) },
    near: { value: camera.near }, far: { value: camera.far },
    thick: { value: Math.max(1, _sz.y / 700) },
    lineColor: { value: new THREE.Color(0x120d12) },
    night: { value: 0 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    precision highp float;
    uniform sampler2D tColor; uniform sampler2D tDepth;
    uniform vec2 texel; uniform float near; uniform float far; uniform float thick;
    uniform vec3 lineColor; uniform float night;
    varying vec2 vUv;
    float invZ(vec2 uv){
      float d = texture2D(tDepth, uv).x;
      float z = d * 2.0 - 1.0;
      float lin = 2.0 * near * far / (far + near - z * (far - near));
      return 1.0 / lin;
    }
    void main(){
      vec3 col = texture2D(tColor, vUv).rgb;
      vec2 o = texel * thick;
      float c0 = invZ(vUv);
      float a = invZ(vUv + vec2(o.x, 0.0)), b = invZ(vUv - vec2(o.x, 0.0));
      float c = invZ(vUv + vec2(0.0, o.y)), d = invZ(vUv - vec2(0.0, o.y));
      float lap = max(abs(a + b - 2.0 * c0), abs(c + d - 2.0 * c0));
      float m = max(max(c0, a), max(max(b, c), d));
      float rel = lap / max(m, 1e-5);
      float e = smoothstep(0.006, 0.02, rel);
      float dist = 1.0 / max(c0, 1e-5);
      e *= 1.0 - smoothstep(170.0, 520.0, dist);
      col = mix(col, lineColor, e * 0.92);
      // 調色：暖亮部／冷暗部＋輕微對比
      float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col *= mix(vec3(0.90, 0.96, 1.10), vec3(1.07, 1.01, 0.90), smoothstep(0.04, 0.5, lum));
      col = mix(vec3(lum), col, 1.06);
      col = clamp(col, 0.0, 1.0);
      gl_FragColor = linearToOutputTexel(vec4(col, 1.0));
    }`,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
function renderFrame() {
  renderer.info.reset();
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  const dc = renderer.info.render.calls, tri = renderer.info.render.triangles;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
  renderer.info.render.calls = dc; renderer.info.render.triangles = tri;
}
function resizePost() {
  renderer.getDrawingBufferSize(_sz);
  sceneRT.setSize(_sz.x, _sz.y);
  postMat.uniforms.texel.value.set(1 / _sz.x, 1 / _sz.y);
  postMat.uniforms.thick.value = Math.max(1, _sz.y / 700);
}

const controls = new PointerLockControls(camera, renderer.domElement);
// 光照：暖陽（硬陰影）＋冷色天光
const sun = new THREE.DirectionalLight(0xfff0d2, 2.3);
sun.position.set(130, 55, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
scene.add(sun); scene.add(sun.target);
const SUN_DIR = new THREE.Vector3(130, 70, 90).normalize();
const hemi = new THREE.HemisphereLight(0xb9cbee, 0xcdb48e, 1.35);
scene.add(hemi);
scene.fog = new THREE.Fog(0xcfe2d4, 170, 520);

// Pastel 日光光暈（淡、弱）
{
  const gc = document.createElement('canvas'); gc.width = 256; gc.height = 256;
  const gg = gc.getContext('2d');
  const gr = gg.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,244,224,1)'); gr.addColorStop(0.18, 'rgba(255,236,200,0.7)'); gr.addColorStop(0.42, 'rgba(240,225,190,0.25)'); gr.addColorStop(1, 'rgba(230,220,200,0)');
  gg.fillStyle = gr; gg.fillRect(0, 0, 256, 256);
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.5, fog: false }));
  sunSprite.position.set(220, 30, -280); sunSprite.scale.set(150, 150, 1);
  scene.add(sunSprite);
}

overlay.addEventListener('click', () => { controls.lock(); initAudio(); });
controls.addEventListener('lock', () => overlay.classList.add('hidden'));
controls.addEventListener('unlock', () => overlay.classList.remove('hidden'));
// ================= 怡雅苑 5 座（每座 35 層新十字型，白＋青綠清爽幾何） =================
const FLOORS = 35, FLOOR_H = 2.85, H = FLOORS * FLOOR_H;
const CORE = 10, LONG = 15.75, SHORT = 9, WING_W = 11;
const TEAL = 0x4f9c8a, FRAME = 0xcdbb92, GLASS = 0x24324f, WALL = 0xe9dcbc;

const wallGeos = [], gableGeos = [], frameGeos = [], glassGeos = [];
const balcFloorGeos = [], balcRailGeos = [], balcLineGeos = [], roofGeos = [];
const boxT = (sx, sy, sz, x, y, z) => { const g = new THREE.BoxGeometry(sx, sy, sz); g.translate(x, y, z); return g; };

function addWindow(axis, x, y, z, w, h, loc) {
  const fw = w + 0.18, fh = h + 0.18;
  if (axis === 'x') { frameGeos.push(loc(boxT(0.07, fh, fw, x, y, z))); glassGeos.push(loc(boxT(0.035, h, w, x, y, z))); }
  else { frameGeos.push(loc(boxT(fw, fh, 0.07, x, y, z))); glassGeos.push(loc(boxT(w, h, 0.035, x, y, z))); }
}
function addBalcony(axis, x, y, z, dir, loc) {
  const d = 1.0, bw = 1.55, br = 0.9;
  if (axis === 'x') {
    balcFloorGeos.push(loc(boxT(d, 0.08, bw, x + dir * (WING_W / 2 + d / 2), y, z)));
    balcRailGeos.push(loc(boxT(0.05, br, bw, x + dir * (WING_W / 2 + d - 0.025), y + 0.04 + br / 2, z)));
    balcRailGeos.push(loc(boxT(0.05, br, bw - 0.1, x + dir * (WING_W / 2 + 0.02), y + 0.04 + br / 2, z + bw / 2 - 0.05)));
    balcLineGeos.push(loc(boxT(0.04, 0.04, bw, x + dir * (WING_W / 2 + d - 0.35), y + br + 0.32, z)));
  } else {
    balcFloorGeos.push(loc(boxT(bw, 0.08, d, x, y, z + dir * (WING_W / 2 + d / 2))));
    balcRailGeos.push(loc(boxT(bw, br, 0.05, x, y + 0.04 + br / 2, z + dir * (WING_W / 2 + d - 0.025))));
    balcRailGeos.push(loc(boxT(bw - 0.1, br, 0.05, x + bw / 2 - 0.05, y + 0.04 + br / 2, z + dir * (WING_W / 2 + 0.02))));
    balcLineGeos.push(loc(boxT(bw, 0.04, 0.04, x, y + br + 0.32, z + dir * (WING_W / 2 + d - 0.35))));
  }
}
function buildTower(cx, cz, rotDeg) {
  const rot = rotDeg * Math.PI / 180;
  const loc = (g) => { g.rotateY(rot); g.translate(cx, 0, cz); return g; };
  const wings = [
    { axis: 'z', dir: 1, len: LONG, windows: 7 },
    { axis: 'z', dir: -1, len: LONG, windows: 7 },
    { axis: 'x', dir: 1, len: SHORT, windows: 4 },
    { axis: 'x', dir: -1, len: SHORT, windows: 4 },
  ];
  for (const w of wings) {
    const off = CORE / 2 + w.len / 2;
    let px = 0, pz = 0;
    if (w.axis === 'z') { pz = w.dir * off; wallGeos.push(loc(boxT(WING_W, H, w.len, 0, H / 2, pz))); }
    else { px = w.dir * off; wallGeos.push(loc(boxT(w.len, H, WING_W, px, H / 2, 0))); }
    if (w.axis === 'z') {
      const ez = w.dir * (CORE / 2 + w.len);
      wallGeos.push(loc(boxT(WING_W, H, 0.2, 0, H / 2, ez)));
      gableGeos.push(loc(boxT(WING_W, 0.5, 0.34, 0, H - 0.25, ez)));
      gableGeos.push(loc(boxT(WING_W, 0.5, 0.34, 0, 0.25, ez)));
      gableGeos.push(loc(boxT(0.5, H, 0.34, -(WING_W / 2 - 0.25), H / 2, ez)));
      gableGeos.push(loc(boxT(0.5, H, 0.34, +(WING_W / 2 - 0.25), H / 2, ez)));
    } else {
      const ex = w.dir * (CORE / 2 + w.len);
      wallGeos.push(loc(boxT(0.2, H, WING_W, ex, H / 2, 0)));
      gableGeos.push(loc(boxT(0.34, 0.5, WING_W, ex, H - 0.25, 0)));
      gableGeos.push(loc(boxT(0.34, 0.5, WING_W, ex, 0.25, 0)));
      gableGeos.push(loc(boxT(0.34, H, 0.5, ex, H / 2, -(WING_W / 2 - 0.25))));
      gableGeos.push(loc(boxT(0.34, H, 0.5, ex, H / 2, +(WING_W / 2 - 0.25))));
    }
    const nWin = w.windows;
    for (let f = 1; f <= FLOORS; f++) {
      const y = f * FLOOR_H + 1.35;
      for (let k = 0; k < nWin; k++) {
        const t = w.len * (k + 0.5) / nWin;
        const big = k % 2 === 0;
        const ww = big ? 1.85 : 1.15, wh = big ? 1.5 : 1.15;
        if (w.axis === 'z') {
          const wz = w.dir * (CORE / 2 + 0.4 + t);
          addWindow('x', WING_W / 2 - 0.035, y, wz, ww, wh, loc);
          addWindow('x', -(WING_W / 2 - 0.035), y, wz, ww, wh, loc);
        } else {
          const wx = w.dir * (CORE / 2 + 0.4 + t);
          addWindow('z', wx, y, WING_W / 2 - 0.035, ww, wh, loc);
          addWindow('z', wx, y, -(WING_W / 2 - 0.035), ww, wh, loc);
        }
      }
    }
    const nUnit = w.windows >= 7 ? 3 : 2;
    for (let f = 1; f <= FLOORS; f++) {
      const y = f * FLOOR_H + 1.1;
      for (let k = 0; k < nUnit; k++) {
        const t = w.len * (k + 0.5) / nUnit;
        const side = (f + k) % 2 === 0 ? 1 : -1;
        if (w.axis === 'z') addBalcony('x', 0, y, w.dir * (CORE / 2 + 0.5 + t), side, loc);
        else addBalcony('z', w.dir * (CORE / 2 + 0.5 + t), y, 0, side, loc);
      }
    }
    if (w.axis === 'z') roofGeos.push(loc(boxT(4, 2.4, 4, 0, H + 1.2, w.dir * (CORE / 2 + w.len / 2))));
    else roofGeos.push(loc(boxT(4, 2.4, 4, w.dir * (CORE / 2 + w.len / 2), H + 1.2, 0)));
  }
  const CW = 1;
  wallGeos.push(loc(boxT(CORE, H, CW, 0, H / 2, -(CORE / 2 - CW / 2))));
  wallGeos.push(loc(boxT(CORE, H, CW, 0, H / 2, +(CORE / 2 - CW / 2))));
  wallGeos.push(loc(boxT(CW, H, CORE, -(CORE / 2 - CW / 2), H / 2, 0)));
  wallGeos.push(loc(boxT(CW, H, CORE, +(CORE / 2 - CW / 2), H / 2, 0)));
  for (let f = 1; f <= FLOORS; f++) {
    const y = f * FLOOR_H + 1.2;
    addWindow('z', 0, y, -(CORE / 2 - 0.035), 0.9, 1.1, loc);
    addWindow('z', 0, y, +(CORE / 2 - 0.035), 0.9, 1.1, loc);
    addWindow('x', -(CORE / 2 - 0.035), y, 0, 0.9, 1.1, loc);
    addWindow('x', +(CORE / 2 - 0.035), y, 0, 0.9, 1.1, loc);
  }
  roofGeos.push(loc(boxT(0.8, 7, 0.8, -3.2, H + 3.5, -3.2)));
  roofGeos.push(loc(boxT(0.8, 7, 0.8, 3.2, H + 3.5, -3.2)));
  roofGeos.push(loc(boxT(0.8, 7, 0.8, -3.2, H + 3.5, 3.2)));
  roofGeos.push(loc(boxT(0.8, 7, 0.8, 3.2, H + 3.5, 3.2)));
  roofGeos.push(loc(boxT(7, 0.6, 7, 0, H + 7.3, 0)));
  roofGeos.push(loc(boxT(2.2, 2.6, 2.2, 0, H + 9.2, 0)));
  roofGeos.push(loc(boxT(0.25, 5, 0.25, 0, H + 11.8, 0)));
  gableGeos.push(loc(boxT(7.6, 0.5, 7.6, 0, H + 7.6, 0)));
}

// 5 座擺位（圍住中央花園，座距 ~52m，旋轉各異）
const towers = [
  { x: -52, z: -48, rot: 0,   r: 22 },
  { x: 0,   z: -48, rot: 60,  r: 22 },
  { x: 52,  z: -48, rot: 120, r: 22 },
  { x: -26, z: 48,  rot: 30,  r: 22 },
  { x: 26,  z: 48,  rot: 90,  r: 22 },
];
for (const t of towers) buildTower(t.x, t.z, t.rot);
window.__WT_TOWERS = towers.map(t => ({ ...t }));

// ── debug hook：合併地圖樓宇位置驗收用（量實際 mesh 世界 bbox，唔靠肉眼）──
window.__WT_MERGE_PROBE = () => {
  const out = [];
  scene.traverse(o => {
    if (!o.isMesh || !o.name || !o.name.startsWith('shg-')) return;
    const g = o.geometry; if (!g) return;
    g.computeBoundingBox(); const bb = g.boundingBox; if (!bb) return;
    out.push({
      name: o.name,
      tris: (g.index ? g.index.count : g.attributes.position.count) / 3,
      min: [+bb.min.x.toFixed(2), +bb.min.y.toFixed(2), +bb.min.z.toFixed(2)],
      max: [+bb.max.x.toFixed(2), +bb.max.y.toFixed(2), +bb.max.z.toFixed(2)],
      cx: +((bb.min.x + bb.max.x) / 2).toFixed(2),
      cz: +((bb.min.z + bb.max.z) / 2).toFixed(2),
      sx: +(bb.max.x - bb.min.x).toFixed(2),
      sy: +(bb.max.y - bb.min.y).toFixed(2),
      sz: +(bb.max.z - bb.min.z).toFixed(2),
    });
  });
  return out;
};

let audioCtx = null, audioMuted = false, stepT = 0;
function initAudio() {
  if (audioCtx) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const mkNoise = () => { const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };

    const s1 = audioCtx.createBufferSource(); s1.buffer = mkNoise(); s1.loop = true;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 0.5;
    const g1 = audioCtx.createGain(); g1.gain.value = 0.035;
    s1.connect(bp); bp.connect(g1); g1.connect(audioCtx.destination); s1.start();
    // 遠車流底噪：白噪→低通
    const s2 = audioCtx.createBufferSource(); s2.buffer = mkNoise(); s2.loop = true;
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.02;
    s2.connect(lp); lp.connect(g2); g2.connect(audioCtx.destination); s2.start();
    // 雀聲定時
    setInterval(() => { if (audioMuted || !audioCtx) return; chirp(); }, 2500 + Math.random() * 4000);
  } catch (e) { /* 音效失敗唔影響遊戲 */ }
}

  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(2100 + Math.random() * 700, t0);
  o.frequency.exponentialRampToValueAtTime(1500 + Math.random() * 600, t0 + 0.08);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.25);
}

// ---- SHG merge buckets（全部 flush 成少量 draw call）----
const SHG_B = {
  wall: [], gable: [], frame: [], frameAlt: [], glass: [], glassV: [],
  ac: [], roof: [], podium: [], pave: [], brick: [], play: [], pav: [],
  pavYellow: [], pavBlue: [], paveYellow: [], playGreen: [], playBlue: [],
  rail: [], metal: [], trunk: [], leaf: [], hedge: [], stone: [],
  road: [], roadLine: [], roadLineY: [], kerb: [],
  carBody: [], carGlass: [], tyre: [],
  cloth: [], clothAlt: [], clothWarm: [],
  awning: [], awningAlt: [], binGreen: [], pipeGrey: [], planter: [], sillGrey: [],
  perBlock: [],
};
let SHG_AC_DRAIN_N = 0;

// ---- helper（幾何一律加 SHG 偏移；全部入 SHG_B，merge 成少量 draw call）----
function shgBox(sx, sy, sz, x, y, z) { const g = new THREE.BoxGeometry(sx, sy, sz); g.translate(x + SHG_OX, y, z + SHG_OZ); return g; }
function shgAddMerged(geos, mat, tag) {
  if (!geos.length) return null;
  const m = new THREE.Mesh(mergeGeometries(geos, false), mat);
  m.frustumCulled = false; if (tag) m.name = 'shg-' + tag;
  scene.add(m); return m;
}
function shgLoc(cx, cz) { return g => { g.translate(cx + SHG_OX, 0, cz + SHG_OZ); return g; }; }
function shgMulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shgAddWindow(axis, x, y, z, w, h, loc, vary) {
  const fw = w + 0.14, fh = h + 0.14;
  const fg = vary ? SHG_B.frameAlt : SHG_B.frame;
  if (axis === 'x') {
    const ox = x + 0.09 * Math.sign(x);
    fg.push(loc(shgBox(0.09, fh, fw, ox, y, z)));
    (vary ? SHG_B.glassV : SHG_B.glass).push(loc(shgBox(0.05, h, w, ox + 0.035 * Math.sign(x), y, z)));
  } else {
    const oz = z + 0.09 * Math.sign(z);
    fg.push(loc(shgBox(fw, fh, 0.09, x, y, oz)));
    (vary ? SHG_B.glassV : SHG_B.glass).push(loc(shgBox(w, h, 0.05, x, y, oz + 0.035 * Math.sign(z))));
  }
}
function shgAddAC(x, y, z, loc, axis) {
  if (axis === 'x') {
    SHG_B.ac.push(loc(shgBox(0.55, 0.06, 1.05, x + 0.3, y - 0.85, z)));
    SHG_B.ac.push(loc(shgBox(0.42, 0.62, 0.85, x + 0.34, y - 0.52, z)));
    if (SHG_AC_DRAIN_N++ % 4 === 0) SHG_B.pipeGrey.push(loc(shgBox(0.09, 0.7, 0.09, x + 0.24, y - 1.15, z + 0.36)));
  } else {
    SHG_B.ac.push(loc(shgBox(1.05, 0.06, 0.55, x, y - 0.85, z - 0.3)));
    SHG_B.ac.push(loc(shgBox(0.85, 0.62, 0.42, x, y - 0.52, z - 0.34)));
    if (SHG_AC_DRAIN_N++ % 4 === 0) SHG_B.pipeGrey.push(loc(shgBox(0.09, 0.7, 0.09, x + 0.36, y - 1.15, z - 0.24)));
  }
}
function shgAddSill(x, y, z, axis, loc, w) {
  const sw = w + 0.55;
  if (axis === 'x') SHG_B.sillGrey.push(loc(shgBox(0.30, 0.10, sw, x + 0.14 * Math.sign(x), y - 1.02, z)));
  else SHG_B.sillGrey.push(loc(shgBox(sw, 0.10, 0.30, x, y - 1.02, z + 0.14 * Math.sign(z))));
}
function shgAddGrille(x, y, z, axis, loc, w) {
  const sw = w - 0.3;
  if (axis === 'x') {
    SHG_B.metal.push(loc(shgBox(0.05, 1.55, 0.05, x + 0.055, y, z)));
    SHG_B.metal.push(loc(shgBox(0.05, 0.05, sw, x + 0.055, y + 0.78, z)));
    SHG_B.metal.push(loc(shgBox(0.05, 0.05, sw, x + 0.055, y - 0.78, z)));
  } else {
    SHG_B.metal.push(loc(shgBox(0.05, 1.55, 0.05, x, y, z + 0.055)));
    SHG_B.metal.push(loc(shgBox(sw, 0.05, 0.05, x, y + 0.78, z + 0.055)));
    SHG_B.metal.push(loc(shgBox(sw, 0.05, 0.05, x, y - 0.78, z + 0.055)));
  }
}
function shgAddLaundry(x, y, z, axis, loc, rnd, span) {
  if (axis === 'x') SHG_B.metal.push(loc(shgBox(0.05, 0.05, span, x + 0.35, y, z)));
  else SHG_B.metal.push(loc(shgBox(span, 0.05, 0.05, x, y, z + 0.35)));
  const n = 3 + Math.floor(rnd() * 3);
  const buckets = [SHG_B.cloth, SHG_B.clothAlt, SHG_B.clothWarm];
  for (let i = 0; i < n; i++) {
    const b = buckets[Math.floor(rnd() * buckets.length)];
    const t = (i - (n - 1) / 2) * (span / (n + 0.5));
    const w = 0.34 + rnd() * 0.20, h = 0.55 + rnd() * 0.45;
    if (axis === 'x') b.push(loc(shgBox(0.06, h, w, x + 0.35, y - h / 2 - 0.06, z + t)));
    else b.push(loc(shgBox(w, h, 0.06, x + t, y - h / 2 - 0.06, z + 0.35)));
  }
}
function shgAddFloorBand(x, y, z, axis, loc, len) {
  const c = axis === 'x' ? 0.16 : len, d = axis === 'x' ? len : 0.16;
  if (axis === 'x') SHG_B.sillGrey.push(loc(shgBox(0.20, 0.08, d, x + 0.10 * Math.sign(x), y, z)));
  else SHG_B.sillGrey.push(loc(shgBox(c, 0.08, 0.20, x, y, z + 0.10 * Math.sign(z))));
}

// ---- 十字井型塔樓（module buildCrossTower 原版移植，loc 加偏移）----
const SHG_CORE = 10, SHG_WING_W = 9, SHG_FLOOR_H = 2.8, SHG_SHORT_WING = 9.75, SHG_LONG_WING = 13.0;
function shgBuildCrossTower(cx, cz, opts) {
  const { floors, longs = SHG_LONG_WING, shorts = SHG_SHORT_WING, seed = 1 } = opts;
  const H = floors * SHG_FLOOR_H;
  const rnd = shgMulberry32(seed);
  // ★ BUGFIX（實測發現）：shgBox() 內部已經加咗 SHG_OX/SHG_OZ，
  //   如果 loc 再加一次，所有樓宇會被平移 (SHG_OX, SHG_OZ) —— 即係整整移走一個 offset。
  //   實測證據：wall-K1 實測 cx=240.9 = 19.9 + 110.5×2，聲稱應為 130.4。
  //   所以 loc 只補樓宇自身局部座標 (cx, cz)，唔可以再重複加 merge 偏移。
  const loc = (g) => { g.translate(cx, 0, cz); return g; };
  const wl = [], gl = [];
  SHG_B.perBlock.push({ tag: 'wall-' + opts.tag, geos: wl });
  SHG_B.perBlock.push({ tag: 'gable-' + opts.tag, geos: gl });
  const wings = [
    { axis: 'z', dir: 1, len: longs, units: 3 },
    { axis: 'z', dir: -1, len: longs, units: 3 },
    { axis: 'x', dir: 1, len: shorts, units: 2 },
    { axis: 'x', dir: -1, len: shorts, units: 2 },
  ];
  for (const w of wings) {
    const off = SHG_CORE / 2 + w.len / 2;
    let px = 0, pz = 0;
    if (w.axis === 'z') { pz = w.dir * off; wl.push(loc(shgBox(SHG_WING_W, H, w.len, 0, H / 2, pz))); }
    else { px = w.dir * off; wl.push(loc(shgBox(w.len, H, SHG_WING_W, px, H / 2, 0))); }
    const recH = H * 0.22 / 3;
    const recBase = H * 0.78;
    const recShrink = [1.0, 0.88, 0.76];
    for (let s = 0; s < 3; s++) {
      const sh = recShrink[s];
      const ww2 = SHG_WING_W * sh, ll2 = w.len * sh;
      const fy = recBase + recH * (s + 0.5);
      const segLen = ll2 * 0.6;
      if (w.axis === 'z') {
        const cz2 = w.dir * (SHG_CORE / 2 + w.len - segLen / 2);
        wl.push(loc(shgBox(ww2, recH * (3 - s) / 3 * 1.02, segLen, 0, fy, cz2)));
      } else {
        const cx2 = w.dir * (SHG_CORE / 2 + w.len - segLen / 2);
        wl.push(loc(shgBox(segLen, recH * (3 - s) / 3 * 1.02, ww2, cx2, fy, 0)));
      }
    }
    if (w.axis === 'z') {
      const ez = w.dir * (SHG_CORE / 2 + w.len);
      wl.push(loc(shgBox(SHG_WING_W, H, 0.18, 0, H / 2, ez)));
      gl.push(loc(shgBox(SHG_WING_W + 0.5, 0.45, 0.32, 0, H - 0.22, ez)));
      gl.push(loc(shgBox(SHG_WING_W + 0.5, 0.45, 0.32, 0, 0.22, ez)));
      gl.push(loc(shgBox(0.45, H, 0.32, -(SHG_WING_W / 2 - 0.2), H / 2, ez)));
      gl.push(loc(shgBox(0.45, H, 0.32, +(SHG_WING_W / 2 - 0.2), H / 2, ez)));
    } else {
      const ex = w.dir * (SHG_CORE / 2 + w.len);
      wl.push(loc(shgBox(0.18, H, SHG_WING_W, ex, H / 2, 0)));
      gl.push(loc(shgBox(0.32, 0.45, SHG_WING_W + 0.5, ex, H - 0.22, 0)));
      gl.push(loc(shgBox(0.32, 0.45, SHG_WING_W + 0.5, ex, 0.22, 0)));
      gl.push(loc(shgBox(0.32, H, 0.45, ex, H / 2, -(SHG_WING_W / 2 - 0.2))));
      gl.push(loc(shgBox(0.32, H, 0.45, ex, H / 2, +(SHG_WING_W / 2 - 0.2))));
    }
    const nWin = w.units >= 3 ? 4 : 3;
    const surf = SHG_WING_W / 2;
    for (let f = 1; f <= floors; f++) {
      const y = f * SHG_FLOOR_H + 1.25;
      shgAddFloorBand(surf, f * SHG_FLOOR_H + 0.15, w.dir * (SHG_CORE / 2 + w.len / 2), 'x', loc, w.len);
      shgAddFloorBand(-surf, f * SHG_FLOOR_H + 0.15, w.dir * (SHG_CORE / 2 + w.len / 2), 'x', loc, w.len);
      for (let k = 0; k < nWin; k++) {
        const t = w.len * (k + 0.5) / nWin;
        const vary = rnd() < 0.12;
        const big = k % 2 === 0;
        const ww = big ? 2.9 : 2.3, wh = big ? 1.85 : 1.6;
        if (w.axis === 'z') {
          const wz = w.dir * (SHG_CORE / 2 + 0.35 + t);
          shgAddWindow('x', surf, y, wz, ww, wh, loc, vary);
          shgAddWindow('x', -surf, y, wz, ww, wh, loc, rnd() < 0.12);
          if (big) { shgAddSill(surf, y, wz, 'x', loc, ww); shgAddSill(-surf, y, wz, 'x', loc, ww); }
          if (big && rnd() < 0.18) shgAddGrille(surf, y, wz, 'x', loc, ww);
          if (big && rnd() < 0.18) shgAddGrille(-surf, y, wz, 'x', loc, ww);
          shgAddAC(surf, y, wz, loc, 'x'); shgAddAC(-surf, y, wz, loc, 'x');
        } else {
          const wx = w.dir * (SHG_CORE / 2 + 0.35 + t);
          shgAddWindow('z', wx, y, surf, ww, wh, loc, vary);
          shgAddWindow('z', wx, y, -surf, ww, wh, loc, rnd() < 0.12);
          if (big) { shgAddSill(wx, y, surf, 'z', loc, ww); shgAddSill(wx, y, -surf, 'z', loc, ww); }
          if (big && rnd() < 0.18) shgAddGrille(wx, y, surf, 'z', loc, ww);
          if (big && rnd() < 0.18) shgAddGrille(wx, y, -surf, 'z', loc, ww);
          shgAddAC(wx, y, surf, loc, 'z'); shgAddAC(wx, y, -surf, loc, 'z');
        }
      }
    }
    for (let i = 0; i < 6; i++) {
      const f0 = 3 + Math.floor(rnd() * (floors - 5));
      const t = w.len * (0.2 + rnd() * 0.6);
      const span = 1.6 + rnd() * 0.8;
      if (w.axis === 'z') {
        shgAddLaundry(SHG_WING_W / 2, f0 * SHG_FLOOR_H + 1.05, w.dir * (SHG_CORE / 2 + t), 'x', loc, rnd, span);
        shgAddLaundry(-SHG_WING_W / 2, f0 * SHG_FLOOR_H + 1.05, w.dir * (SHG_CORE / 2 + t), 'x', loc, rnd, span);
      } else {
        shgAddLaundry(w.dir * (SHG_CORE / 2 + t), f0 * SHG_FLOOR_H + 1.05, SHG_WING_W / 2, 'z', loc, rnd, span);
        shgAddLaundry(w.dir * (SHG_CORE / 2 + t), f0 * SHG_FLOOR_H + 1.05, -SHG_WING_W / 2, 'z', loc, rnd, span);
      }
    }
    for (const t of [0.12, 0.88]) {
      const p = w.dir * (SHG_CORE / 2 + w.len * t);
      if (w.axis === 'z') {
        SHG_B.pipeGrey.push(loc(shgBox(0.16, H, 0.16, SHG_WING_W / 2 + 0.10, H / 2, p)));
        SHG_B.pipeGrey.push(loc(shgBox(0.16, H, 0.16, -(SHG_WING_W / 2 + 0.10), H / 2, p)));
      } else {
        SHG_B.pipeGrey.push(loc(shgBox(0.16, H, 0.16, p, H / 2, SHG_WING_W / 2 + 0.10)));
        SHG_B.pipeGrey.push(loc(shgBox(0.16, H, 0.16, p, H / 2, -(SHG_WING_W / 2 + 0.10))));
      }
    }
  }
  const CW = 1.0;
  wl.push(loc(shgBox(SHG_CORE, H, CW, 0, H / 2, -(SHG_CORE / 2 - CW / 2))));
  wl.push(loc(shgBox(SHG_CORE, H, CW, 0, H / 2, +(SHG_CORE / 2 - CW / 2))));
  wl.push(loc(shgBox(CW, H, SHG_CORE, -(SHG_CORE / 2 - CW / 2), H / 2, 0)));
  wl.push(loc(shgBox(CW, H, SHG_CORE, +(SHG_CORE / 2 - CW / 2), H / 2, 0)));
  for (let f = 1; f <= floors; f++) {
    const y = f * SHG_FLOOR_H + 1.15;
    shgAddWindow('z', 0, y, -(SHG_CORE / 2), 1.1, 1.3, loc, rnd() < 0.12);
    shgAddWindow('z', 0, y, +(SHG_CORE / 2), 1.1, 1.3, loc, rnd() < 0.12);
    shgAddWindow('x', -(SHG_CORE / 2), y, 0, 1.1, 1.3, loc, rnd() < 0.12);
    shgAddWindow('x', +(SHG_CORE / 2), y, 0, 1.1, 1.3, loc, rnd() < 0.12);
    shgAddFloorBand(SHG_CORE / 2, f * SHG_FLOOR_H + 0.15, 0, 'x', loc, SHG_CORE);
    shgAddFloorBand(-SHG_CORE / 2, f * SHG_FLOOR_H + 0.15, 0, 'x', loc, SHG_CORE);
  }
  for (let i = 0; i < 6; i++) {
    const rx = (rnd() - 0.5) * 6.5, rz = (rnd() - 0.5) * 6.5;
    const rh = 1.0 + rnd() * 0.4;
    for (const [ox, oz] of [[-0.7, 0], [0.7, 0]]) {
      SHG_B.metal.push(loc(shgBox(0.07, rh, 0.07, rx + ox, H + 7.1 + rh / 2, rz)));
    }
    SHG_B.metal.push(loc(shgBox(1.7, 0.05, 0.05, rx, H + 7.1 + rh, rz)));
    const b = [SHG_B.cloth, SHG_B.clothAlt, SHG_B.clothWarm][Math.floor(rnd() * 3)];
    for (let k = 0; k < 2 + Math.floor(rnd() * 2); k++) {
      b.push(loc(shgBox(0.28 + rnd() * 0.15, 0.5 + rnd() * 0.3, 0.05, rx - 0.5 + k * 0.55, H + 7.1 + rh - 0.35, rz)));
    }
  }
  SHG_B.pipeGrey.push(loc(shgBox(0.18, 6.8, 0.18, -1.9, H + 4.6, -1.9)));
  for (const [dx, dz, sw, sd] of [[0, -3.3, 6.8, 0.14], [0, 3.3, 6.8, 0.14], [-3.3, 0, 0.14, 6.8], [3.3, 0, 0.14, 6.8]]) {
    SHG_B.rail.push(loc(shgBox(sw, 1.05, sd, dx, H + 7.6, dz)));
  }
  SHG_B.roof.push(loc(shgBox(4.2, 2.4, 4.2, 0, H + 1.2, 0)));
  SHG_B.roof.push(loc(shgBox(0.7, 6.5, 0.7, -3.0, H + 3.3, -3.0)));
  SHG_B.roof.push(loc(shgBox(0.7, 6.5, 0.7, 3.0, H + 3.3, -3.0)));
  SHG_B.roof.push(loc(shgBox(0.7, 6.5, 0.7, -3.0, H + 3.3, 3.0)));
  SHG_B.roof.push(loc(shgBox(0.7, 6.5, 0.7, 3.0, H + 3.3, 3.0)));
  SHG_B.roof.push(loc(shgBox(6.8, 0.5, 6.8, 0, H + 6.8, 0)));
  SHG_B.roof.push(loc(shgBox(2.4, 1.0, 2.4, 0, H + 7.5, 0)));
  SHG_B.roof.push(loc(shgBox(2.0, 1.0, 2.0, -3.0, H + 7.2, 1.8)));
  SHG_B.roof.push(loc(shgBox(0.22, 4.5, 0.22, 0, H + 9.4, 0)));
  gl.push(loc(shgBox(7.2, 0.4, 7.2, 0, H + 7.1, 0)));
  return { H, footprint: { w: SHG_CORE + shorts * 2, d: SHG_CORE + longs * 2 } };
}

// 5 座（OSM 實測 centre；local y→game z = −y）
const SHG_BLOCKS = [
  { id: 'K1', name: '康智閣', en: 'HONG CHE COURT', floors: 32, cx: 19.9, lz: -61.6, seed: 1101, wall: 0xe8dcc0 },
  { id: 'K2', name: '康仁閣', en: 'HONG YAN COURT', floors: 32, cx: 20.2, lz: -20.6, seed: 2202, wall: 0xe2cfb2 },
  { id: 'K3', name: '康信閣', en: 'HONG SHUN COURT', floors: 32, cx: 19.0, lz: 21.4, seed: 3303, wall: 0xe6d6b8 },
  { id: 'K4', name: '康誠閣', en: 'HONG SHING COURT', floors: 32, cx: 20.3, lz: 62.6, seed: 4404, wall: 0xe9dcc4 },
  { id: 'K5', name: '康民閣', en: 'HONG MAN COURT', floors: 18, cx: -36.7, lz: 61.2, seed: 5505, wall: 0xe2cfb2 },
];
const shgTowers = [];
const SHG_BLOCK_MAT = {};
for (const b of SHG_BLOCKS) {
  SHG_BLOCK_MAT[b.id] = {
    wall: new THREE.MeshStandardMaterial({ color: b.wall, roughness: 0.9 }),
    gable: new THREE.MeshStandardMaterial({ color: 0xe2cfb2, roughness: 0.9 }),
  };
}
for (const b of SHG_BLOCKS) {
  const gz = -b.lz;
  const info = shgBuildCrossTower(b.cx, gz, { floors: b.floors, seed: b.seed, tag: b.id });
  // 塔底薄平台（貼地，唔再擋路）。

window.__WT_OFFERS = () => game.offers ? game.offers.map(o => ({ food: o.food, price: o.price, dist: o.dist, urgent: o.urgent, deadlineMin: o.deadlineMin })) : null;
window.__WT_COMPASS = () => !!document.querySelector('canvas[width="54"]');
window.__WT_COMPASS_DIST = () => compDist.textContent;
window.__WT_COMPASS_ANG = () => +_compAng.toFixed(3);
window.__WT_BIKE = () => ({ wb: worldBike.visible, wx: +worldBike.position.x.toFixed(1), wy: +worldBike.position.y.toFixed(2), wz: +worldBike.position.z.toFixed(1), px: +player.x.toFixed(1), pz: +player.z.toFixed(1), type: worldBike.userData.type, rack: worldBike.userData.rackBag.visible, rackCam: bikeView.userData.rackBag.visible });
window.__WT_COMPASS_RECT = () => { const el = document.querySelector('canvas[width="54"]'); const r = el ? el.getBoundingClientRect() : null; return r ? { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height), vw: window.innerWidth } : null; };
window.__WT_FOUNTAIN = () => ({ x: fountain.position.x, z: fountain.position.z });
game.phase = 'idle';   // 等玩家按 T 開手機接單

// ================= 第一人稱控制（WASD＋PointerLock＋圓碰撞） =================
const player = { x: 0, z: 77, speedMult: 1, vehicle: 'bike', upgrades: 0, mounted: true, speedMS: 0 };
const keys = {};
const speed = 0.833, runSpeed = 1.53;   // 步行 ≈3 km/h、跑 ≈5.5 km/h（用戶拍板：貼近現實）
const VEH_SPEED = { bike: { cruise: 2.78, sprint: 5.0 }, moto: { cruise: 9.72, sprint: 9.72 } };   // 單車 ≈10／衝刺 ≈18、電單車 ≈35 km/h（靜止巡航穩定）
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; });

function collide(nx, nz) {
  for (const b of towers) {
    const dx = nx - b.x, dz = nz - b.z;
    const d = Math.hypot(dx, dz);
    if (d < b.r && d > 0.001) { nx = b.x + dx / d * b.r; nz = b.z + dz / d * b.r; }
  }
  for (const c of circles) {
    const dx = nx - c.x, dz = nz - c.z, rr = c.r + 0.35, d2 = dx * dx + dz * dz;
    if (d2 < rr * rr) { const d = Math.sqrt(d2) || 0.001; nx = c.x + dx / d * rr; nz = c.z + dz / d * rr; }
  }
  for (const list of [rects, shgRects]) for (const r of list) {
    const hw = r.w / 2 + 0.4, hd = r.d / 2 + 0.4;
    if (nx > r.x - hw && nx < r.x + hw && nz > r.z - hd && nz < r.z + hd) {
      const dl = nx - (r.x - hw), dr = (r.x + hw) - nx, dzl = nz - (r.z - hd), dzr = (r.z + hd) - nz;
      const m = Math.min(dl, dr, dzl, dzr);
      if (m === dl) nx = r.x - hw; else if (m === dr) nx = r.x + hw;
      else if (m === dzl) nz = r.z - hd; else nz = r.z + hd;
    }
  }
  return [Math.max(-109, Math.min(205, nx)), Math.max(-268, Math.min(100, nz))];
}

window.__WT_TEST_RECT = (x, z) => { const c = collide(x, z); return { x: +c[0].toFixed(1), z: +c[1].toFixed(1) }; };

window.__WT_SET_POS = (x, z, yawDeg, pitchDeg) => {
  player.x = x; player.z = z;
  camera.position.set(player.x, 1.6, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yawDeg * Math.PI / 180;
  camera.rotation.x = pitchDeg * Math.PI / 180;
};

window.__WT_DEBUG_CAM = () => {
  const p = camera.position, r = camera.rotation;
  return { px: +p.x.toFixed(2), py: +p.y.toFixed(2), pz: +p.z.toFixed(2), ry: +r.y.toFixed(3), rx: +r.x.toFixed(3) };
};
// 自由相機（驗收截圖用）：唔經玩家，直接擺相機。_wtFreeCam 會鎖住 render loop 唔好覆寫。
let _wtFreeCam = false;
// 截圖工具用：清走 scene fog（fog 令鳥瞰驗收圖睇唔清樓宇對位；只影響截圖工具，唔改遊戲設定）
window.__WT_CLEAR_FOG = () => { scene.fog = null; scene.traverse(o => { if (o.isMesh && o.material) o.material.needsUpdate = true; }); return true; };
window.__WT_SET_CAM = (pos, look, fov) => {
  _wtFreeCam = true;
  camera.fov = fov || 60;
  camera.position.set(pos[0], pos[1], pos[2]);
  camera.up.set(0, 1, 0);
  camera.lookAt(look[0], look[1], look[2]);
  camera.updateProjectionMatrix();
  player.x = pos[0]; player.z = pos[2];
  return true;
};
window.__WT_READY = true;
window.__WT_METRICS = { triangles: 0, drawCalls: 0, fps: 0, errors: [], pos: [0, 0] };
window.addEventListener('error', e => window.__WT_METRICS.errors.push(String(e.message)));

let _last = performance.now();
let _elapsed = 0;
function deltaAccum() { const n = performance.now(); const d = n - _last; _last = n; return d; }
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, deltaAccum() / 1000);
  _elapsed += dt;
  clockTick(dt);   // 世界鐘（每實秒 +0.1 遊戲分鐘）＋生活 tick
  frm++; // 分層節流計數器（Qwen C）
  if (frm % 15 === 0) {
    updateLabels4Hz();   // 標籤 4Hz
    syncFoodBag();       // 外賣袋位置（貨架↔手）
    if (shopOn && Math.hypot(player.x - SHOP_POS.x, player.z - SHOP_POS.z) > 9) { shopOn = false; shopDiv.style.display = 'none'; }   // 離開車店自動關 menu（避免同手機重疊）
  }
  drawCompass();
  updateCrowd(dt, _elapsed); updateStaff(_elapsed);
  const drawMinimap = frm % 6 === 0;       // minimap 10Hz
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
  let mvx = 0, mvz = 0;
  if (keys['KeyW']) { mvx += fwd.x; mvz += fwd.z; }
  if (keys['KeyS']) { mvx -= fwd.x; mvz -= fwd.z; }
  if (keys['KeyA']) { mvx -= right.x; mvz -= right.z; }
  if (keys['KeyD']) { mvx += right.x; mvz += right.z; }
  const sprinting = keys['ShiftLeft'] || keys['ShiftRight'];
  const wob = 1 + 0.1 * Math.sin(game.clockMin * 9.1 + (player.vehicle === 'moto' ? 0 : 2.7));   // 自然浮動 ±10%（跑／單車浮動；電單車穩定 35）
  const base = !player.mounted
    ? (sprinting ? runSpeed : speed)
    : (player.vehicle === 'moto' ? VEH_SPEED.moto.cruise : (sprinting ? VEH_SPEED.bike.sprint : VEH_SPEED.bike.cruise));
  const sp = base * (player.mounted ? player.speedMult : 1) * lifeSpeedMult() * (player.vehicle === 'moto' ? 1 : wob);   // 上車先有車速；生活狀態差會跌速
  const len = Math.hypot(mvx, mvz);
  player.speedMS = len > 0.001 ? sp : 0;   // 實時速度（m/s）——HUD 顯示 km/h
  if (len > 0.001) {
    const px0 = player.x, pz0 = player.z;
    const [nx, nz] = collide(player.x + mvx / len * sp * dt, player.z + mvz / len * sp * dt);
    player.x = nx; player.z = nz;
    _moveAcc += Math.hypot(nx - px0, nz - pz0);   // 移動距離累計（米）
    if (_moveAcc >= _KM_STEP) { _moveAcc -= _KM_STEP; consumeMoveKm(); }   // 每行 200m 扣一次（玩家即時見到消耗）
    camera.position.set(player.x, 1.6, player.z);
    stepT += dt * (sp > speed ? 2.4 : 1.6);
    if (stepT >= 1) { stepT = 0; footstep(); }
  }
  const info = renderer.info;
  __WT_METRICS.triangles = info.render.triangles;
  __WT_METRICS.drawCalls = info.render.calls;
  __WT_METRICS.fps = dt > 0 ? Math.round(1 / dt) : 60;
  __WT_METRICS.pos = [Math.round(player.x), Math.round(player.z)];
  hud.innerHTML = `怡雅苑 Walkthrough Prototype · 5 座新十字型<br>FPS ${__WT_METRICS.fps} · dc ${__WT_METRICS.drawCalls} · tri ${__WT_METRICS.triangles}<br>pos (${__WT_METRICS.pos[0]}, ${__WT_METRICS.pos[1]})`;
  updateGameHUD();
  // ===== 體驗動態更新 =====
  updateSignals(_elapsed); updateTraffic(dt, _elapsed);
  for (let i = 0; i < dropPhases.length; i++) {
    const u = dropPhases[i];
    u.t = (u.t + dt * 0.7) % 1;
    const r = u.t * 1.9, y = 1.0 + Math.sin(u.t * Math.PI) * 2.6;
    drops.setMatrixAt(i, new THREE.Matrix4().makeTranslation(Math.cos(u.a) * r, y + 0.4, Math.sin(u.a) * r));
  }
  drops.instanceMatrix.needsUpdate = true;
  updateClouds(dt); updateLeaves(dt, _elapsed);
  // 太陽陰影跟住玩家（硬邊長影）
  { const px = Math.round(player.x), pz = Math.round(player.z);
    sun.target.position.set(px, 0, pz); sun.position.set(px + SUN_DIR.x * 200, SUN_DIR.y * 200, pz + SUN_DIR.z * 200); sun.target.updateMatrixWorld(); }
  // Auto Tour
  if (tour) {
    tourT += dt * 0.05;
    const n = tourPath.length, t = (tourT % 1) * n, i = Math.floor(t) % n, j = (i + 1) % n, u = t - Math.floor(t);
    const tx = tourPath[i][0] + (tourPath[j][0] - tourPath[i][0]) * u;
    const tz = tourPath[i][1] + (tourPath[j][1] - tourPath[i][1]) * u;
    player.x = tx; player.z = tz;
    camera.position.set(tx, 1.6, tz);
  }
  if (drawMinimap) drawMinimapFrame();
  renderFrame();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); resizePost();
});

    </script>
  </body>
